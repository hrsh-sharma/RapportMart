<ng-template #passwordModal let-modal>
    <div class="cp-modal">
        <!-- Header -->
        <div class="cp-header">
            <div>
                <h3 class="cp-title">{{ 'Change Password' | translate }}</h3>
                <p class="cp-subtitle">Update your account password</p>
            </div>
            <button class="cp-close" (click)="modal.dismiss('Cross click')">
                <i class="ri-close-line"></i>
            </button>
        </div>

        <!-- Form -->
        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="cp-body">
                <div class="cp-field">
                    <label for="cpass">{{ 'Current Password' | translate }}</label>
                    <div class="cp-input-wrap">
                        <input id="cpass" type="password" formControlName="current_password"
                            placeholder="Enter current password"
                            [class.error]="form?.controls?.['current_password']?.touched && form.controls['current_password']?.errors?.['required']">
                        <i class="ri-eye-off-line cp-eye" (click)="togglePasswordVisibility('cpass')"></i>
                    </div>
                    <span class="cp-error" *ngIf="form?.controls?.['current_password']?.touched && form.controls['current_password']?.errors?.['required']">
                        Current password is required
                    </span>
                </div>

                <div class="cp-field">
                    <label for="npass">{{ 'New Password' | translate }}</label>
                    <div class="cp-input-wrap">
                        <input id="npass" type="password" formControlName="password"
                            placeholder="Enter new password"
                            [class.error]="form?.controls?.['password']?.touched && form.controls['password']?.errors?.['required']">
                        <i class="ri-eye-off-line cp-eye" (click)="togglePasswordVisibility('npass')"></i>
                    </div>
                    <span class="cp-error" *ngIf="form?.controls?.['password']?.touched && form.controls['password']?.errors?.['required']">
                        New password is required
                    </span>
                </div>

                <div class="cp-field">
                    <label for="cnpass">{{ 'Confirm Password' | translate }}</label>
                    <div class="cp-input-wrap">
                        <input id="cnpass" type="password" formControlName="password_confirmation"
                            placeholder="Confirm new password"
                            [class.error]="(form?.controls?.['password_confirmation']?.touched && form.controls['password_confirmation']?.errors?.['required']) || passwordMatchError">
                        <i class="ri-eye-off-line cp-eye" (click)="togglePasswordVisibility('cnpass')"></i>
                    </div>
                    <span class="cp-error" *ngIf="form?.controls?.['password_confirmation']?.touched && form.controls['password_confirmation']?.errors?.['required'] && !passwordMatchError">
                        Confirm password is required
                    </span>
                    <span class="cp-error" *ngIf="passwordMatchError">
                        Passwords do not match
                    </span>
                </div>
            </div>

            <!-- Footer -->
            <div class="cp-footer">
                <button type="button" class="cp-btn-cancel" (click)="modal.dismiss('Cancel')">
                    {{ 'Cancel' | translate }}
                </button>
                <button type="submit" class="cp-btn-save">
                    {{ 'Update Password' | translate }}
                </button>
            </div>
        </form>
    </div>
</ng-template>
