<div class="sb">
    <!-- Mobile close -->
    <button class="sb__close d-lg-none" (click)="openMenu(false)">
        <i class="ri-close-line"></i>
    </button>

    <!-- User profile -->
    <div class="sb__user">
        <div class="sb__avatar">
            <img [src]="(user$ | async)?.profile_image?.original_url" alt="profile"
                *ngIf="(user$ | async)?.profile_image?.original_url else avatarPlaceholder">
            <ng-template #avatarPlaceholder>
                <div class="sb__avatar-letter">
                    {{ (user$ | async)?.name?.charAt(0)?.toString()?.toUpperCase() }}
                </div>
            </ng-template>
            <label class="sb__avatar-edit">
                <input type="file" (change)="uploadImage($event)" accept="image/*">
                <i class="ri-camera-line"></i>
            </label>
        </div>
        <h4 class="sb__name">{{ (user$ | async)?.name | titleCase }}</h4>
        <p class="sb__email">{{ (user$ | async)?.email }}</p>
    </div>

    <!-- Navigation -->
    <nav class="sb__nav">
        <a class="sb__link" [routerLinkActive]="['active']" [routerLink]="['/account/dashboard']" (click)="openMenu(false)">
            <i class="ri-dashboard-line"></i> {{ 'Dashboard' | translate }}
        </a>
        <a class="sb__link" [routerLinkActive]="['active']" [routerLink]="['/account/order']" (click)="openMenu(false)">
            <i class="ri-shopping-bag-line"></i> {{ 'My Orders' | translate }}
        </a>
        <a class="sb__link" [routerLinkActive]="['active']" [routerLink]="['/account/addresses']" (click)="openMenu(false)">
            <i class="ri-map-pin-line"></i> {{ 'Saved Address' | translate }}
        </a>
        <a class="sb__link" [routerLinkActive]="['active']" [routerLink]="['/account/notifications']" (click)="openMenu(false)">
            <i class="ri-notification-3-line"></i> {{ 'Notifications' | translate }}
            <span class="sb__badge" *ngIf="unreadNotificationCount">{{ unreadNotificationCount }}</span>
        </a>
    </nav>

    <!-- Logout -->
    <div class="sb__footer">
        <button class="sb__logout" (click)="confirmationModal.openModal()">
            <i class="ri-logout-box-r-line"></i> {{ 'Logout' | translate }}
        </button>
    </div>
</div>

<app-confirmation-modal #confirmationModal (confirmed)="logout()"></app-confirmation-modal>
