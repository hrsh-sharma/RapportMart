<!-- Full-width product layout -->
<div class="pdp-full">
    <!-- Hero: Edge-to-edge split -->
    <div class="pdp-hero">
        <!-- Image — full bleed left -->
        <div class="pdp-hero__media">
            <div class="pdp-hero__badge-row">
                <span class="pdp-badge" *ngIf="product?.is_sale_enable else featured">{{ 'sale' | translate }}</span>
                <ng-template #featured>
                    <span class="pdp-badge pdp-badge--gold" *ngIf="product?.is_featured">{{ 'featured' | translate }}</span>
                </ng-template>
            </div>
            <owl-carousel-o [options]="productSliderLayout" #owlCar>
                <ng-container *ngFor="let image of product?.product_galleries;">
                    <ng-template carouselSlide [id]="image.id.toString()">
                        <div class="pdp-hero__slide">
                            <ng-container *ngIf="videType.includes(image?.mime_type!); else audio">
                                <video class="pdp-hero__video" controls>
                                    <source [src]="image ? image.original_url : ''" [type]="image?.mime_type">
                                </video>
                            </ng-container>
                            <ng-template #audio>
                                <ng-container *ngIf="audioType.includes(image?.mime_type!); else img">
                                    <audio controls><source [src]="image ? image.original_url : ''" [type]="image?.mime_type"></audio>
                                </ng-container>
                            </ng-template>
                            <ng-template #img>
                                <img [src]="image ? image.original_url : 'assets/images/product.png'" class="pdp-hero__img" [alt]="product.name">
                            </ng-template>
                        </div>
                    </ng-template>
                </ng-container>
                <ng-container *ngIf="!product?.product_galleries?.length">
                    <ng-template carouselSlide [id]="'1'">
                        <div class="pdp-hero__slide">
                            <ng-container *ngIf="videType.includes(product?.product_thumbnail?.mime_type!); else audio">
                                <video class="pdp-hero__video" controls>
                                    <source [src]="product.product_thumbnail ? product.product_thumbnail.original_url : ''" [type]="product.product_thumbnail?.mime_type">
                                </video>
                            </ng-container>
                            <ng-template #audio>
                                <ng-container *ngIf="audioType.includes(product?.product_thumbnail?.mime_type!); else img">
                                    <audio controls><source [src]="product.product_thumbnail ? product.product_thumbnail.original_url : ''" [type]="product.product_thumbnail?.mime_type"></audio>
                                </ng-container>
                            </ng-template>
                            <ng-template #img>
                                <img [src]="product.product_thumbnail ? product.product_thumbnail.original_url : 'assets/images/product.png'" class="pdp-hero__img" [alt]="product.name">
                            </ng-template>
                        </div>
                    </ng-template>
                </ng-container>
            </owl-carousel-o>
        </div>

        <!-- Info — right panel -->
        <div class="pdp-hero__details">
            <div class="pdp-hero__details-inner">
                <app-product-contain [product]="product" [option]="option"></app-product-contain>
                <app-product-action [product]="product"></app-product-action>

                <!-- Collapsible info sections -->
                <div class="pdp-accord">
                    <details class="pdp-accord__item" open>
                        <summary class="pdp-accord__trigger">Product Information</summary>
                        <div class="pdp-accord__body">
                            <app-product-information [product]="product"></app-product-information>
                        </div>
                    </details>
                    <details class="pdp-accord__item">
                        <summary class="pdp-accord__trigger">Delivery & Returns</summary>
                        <div class="pdp-accord__body">
                            <app-product-delivery-information [product]="product"></app-product-delivery-information>
                        </div>
                    </details>
                    <details class="pdp-accord__item">
                        <summary class="pdp-accord__trigger">Payment Options</summary>
                        <div class="pdp-accord__body">
                            <app-payment-option [product]="product" [option]="option"></app-payment-option>
                        </div>
                    </details>
                </div>
            </div>
        </div>
    </div>

    <!-- Description section below -->
    <div class="pdp-desc-section">
        <div class="container-fluid-lg">
            <app-product-details-tabs [product]="product"></app-product-details-tabs>
            <div class="related-product-2" *ngIf="product?.cross_sell_products && product?.cross_sell_products?.length">
                <app-product-bundle [product]="product"></app-product-bundle>
            </div>
        </div>
    </div>
</div>
