<section class="ax">
    <div class="ax__card">
        <div class="ax__logo">
            <img src="assets/images/logo-web.png" alt="Rapportmart">
        </div>

        <h1 class="ax__title">Reset Password</h1>
        <p class="ax__sub">Enter your new password below.</p>

        <app-alert></app-alert>

        <form [formGroup]="form" (ngSubmit)="submit()" class="ax__form">
            <div class="ax__field">
                <label>New Password</label>
                <input type="password" formControlName="newPassword"
                    placeholder="Enter new password"
                    [class.error]="form.controls['newPassword'].touched && form.controls['newPassword'].invalid">
                <span class="ax__error" *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].errors?.['required']">New password is required</span>
            </div>

            <div class="ax__field">
                <label>Confirm Password</label>
                <input type="password" formControlName="confirmPassword"
                    placeholder="Confirm new password"
                    [class.error]="form.controls['confirmPassword'].touched && form.controls['confirmPassword'].invalid">
                <span class="ax__error" *ngIf="form.controls['confirmPassword'].touched && form.controls['confirmPassword'].errors?.['required']">Confirm password is required</span>
            </div>

            <div class="ax__submit">
                <app-button [id]="'confirm_pass_btn'" [class]="'ax__btn'">
                    {{ 'Update Password' | translate }} <i class="ri-arrow-right-line"></i>
                </app-button>
            </div>
        </form>

        <p class="ax__switch"><a [routerLink]="['/auth/login']"><i class="ri-arrow-left-line"></i> Back to Sign In</a></p>
    </div>
</section>
