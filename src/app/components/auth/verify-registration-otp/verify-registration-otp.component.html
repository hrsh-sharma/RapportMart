<section class="ax">
    <div class="ax__card">
        <div class="ax__logo">
            <img src="assets/images/logo-web.png" alt="Rapportmart">
        </div>

        <h1 class="ax__title">Verify Your Account</h1>
        <p class="ax__sub">Enter the 6-digit code sent to <strong>{{ email }}</strong></p>

        <app-alert></app-alert>

        <form [formGroup]="form" (ngSubmit)="submit()" class="ax__form">
            <div class="ax__field">
                <label>Verification Code</label>
                <input type="text" formControlName="otp"
                    maxlength="6"
                    placeholder="Enter 6-digit code"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);"
                    [class.error]="form.controls['otp'].touched && form.controls['otp'].invalid">
                <span class="ax__error" *ngIf="form.controls['otp'].touched && form.controls['otp'].errors?.['required']">Verification code is required</span>
                <span class="ax__error" *ngIf="form.controls['otp'].touched && form.controls['otp'].errors?.['pattern']">Please enter a valid 6-digit code</span>
                <span class="ax__error" *ngIf="form.controls['otp'].touched && (form.controls['otp'].errors?.['minlength'] || form.controls['otp'].errors?.['maxlength'])">Code must be exactly 6 digits</span>
            </div>

            <div class="ax__submit">
                <app-button [id]="'verify_otp_btn'" [class]="'ax__btn'">
                    Verify Account <i class="ri-check-line"></i>
                </app-button>
            </div>
        </form>

        <p class="ax__switch"><a [routerLink]="['/auth/register']"><i class="ri-arrow-left-line"></i> Back to Register</a></p>
    </div>
</section>
