<app-breadcrumb [breadcrumb]="breadcrumb"></app-breadcrumb>

<section class="auth-page">
    <div class="auth-split">

        <!-- Left: Brand Panel -->
        <div class="auth-brand-panel">
            <div class="auth-brand-inner">
                <img src="assets/images/repportlogo.png" alt="GROFAB" class="auth-logo">
                <h2 class="auth-brand-heading">Set a New<br><span>Password</span></h2>
                <p class="auth-brand-sub">Choose a strong password to keep your account secure.</p>
                <div class="auth-brand-features">
                    <div class="auth-feature"><i class="ri-lock-line"></i> Use 8+ characters</div>
                    <div class="auth-feature"><i class="ri-key-2-line"></i> Mix letters & numbers</div>
                    <div class="auth-feature"><i class="ri-shield-check-line"></i> Keep it unique</div>
                </div>
            </div>
        </div>

        <!-- Right: Form Panel -->
        <div class="auth-form-panel">
            <div class="auth-form-inner">
                <app-alert></app-alert>

                <div class="auth-form-header">
                    <div class="auth-icon-circle">
                        <i class="ri-lock-password-line"></i>
                    </div>
                    <h1>Reset Password</h1>
                    <p>Enter your new password below.</p>
                </div>

                <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">

                    <div class="auth-field">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" formControlName="newPassword"
                            placeholder="Enter new password"
                            [class.error]="form.controls['newPassword'].touched && form.controls['newPassword'].invalid">
                        <span class="auth-error" *ngIf="form.controls['newPassword'].touched && form.controls['newPassword'].errors?.['required']">New password is required</span>
                    </div>

                    <div class="auth-field">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" formControlName="confirmPassword"
                            placeholder="Confirm new password"
                            [class.error]="form.controls['confirmPassword'].touched && form.controls['confirmPassword'].invalid">
                        <span class="auth-error" *ngIf="form.controls['confirmPassword'].touched && form.controls['confirmPassword'].errors?.['required']">Confirm password is required</span>
                    </div>

                    <div class="auth-submit">
                        <app-button [id]="'confirm_pass_btn'" [class]="'auth-btn-primary'">
                            {{ 'Update Password' | translate }} <i class="ri-arrow-right-line"></i>
                        </app-button>
                    </div>
                </form>

                <div class="auth-switch">
                    <a [routerLink]="['/auth/login']"><i class="ri-arrow-left-line"></i> Back to Sign In</a>
                </div>
            </div>
        </div>

    </div>
</section>
