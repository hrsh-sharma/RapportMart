<section class="acct-page">
    <div class="acct-layout">
        <!-- Sidebar -->
        <aside class="acct-sidebar" [class.open]="open">
            <app-sidebar [show]="open" (menu)="openMenu($event)"></app-sidebar>
        </aside>

        <!-- Main Content -->
        <main class="acct-main">
            <!-- Mobile menu toggle -->
            <div class="acct-mobile-bar d-lg-none">
                <button class="acct-menu-toggle" (click)="openMenu(true)">
                    <i class="ri-menu-line"></i> Menu
                </button>
            </div>

            <div class="acct-content" id="account">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>

    <!-- Mobile overlay -->
    <div class="acct-overlay d-lg-none" [class.show]="open" (click)="openMenu(false)"></div>
</section>
